<div class="login">
  <form class="card" (ngSubmit)="submit()">
    <h1>Documate Admin</h1>
    <p class="sub">Platform control panel · AdminGate</p>
    @if (error()) {
      <p-message severity="error" [text]="error()!" />
    }
    <label>
      Username
      <input pInputText [(ngModel)]="username" name="username" autocomplete="username" />
    </label>
    <label>
      Password
      <p-password
        [(ngModel)]="password"
        name="password"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        autocomplete="current-password"
      />
    </label>
    <p-button type="submit" label="Sign in" [loading]="loading()" styleClass="w-full" />
  </form>
</div>
