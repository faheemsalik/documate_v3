<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand">{{ brand }}</span>
      <span class="brand-hint">Platform control panel</span>
    </div>

    <div class="nav-scroll">
      @for (group of groups; track group.label) {
        <div class="nav-group">
          <button type="button" class="nav-group-header" (click)="toggleGroup(group)">
            <span>{{ group.label }}</span>
            <span class="chevron">{{ isExpanded(group) ? '▾' : '▸' }}</span>
          </button>
          @if (isExpanded(group)) {
            @for (item of group.items; track item.route) {
              <a class="nav-item indent" [routerLink]="item.route" routerLinkActive="active">
                {{ item.label }}
              </a>
            }
          }
        </div>
      }
    </div>

    <div class="sidebar-footer">
      <div class="theme-row">
        <span class="theme-label">Light</span>
        <p-toggleswitch
          [ngModel]="darkMode()"
          (ngModelChange)="onDarkToggle($event)"
          ariaLabel="Toggle dark theme"
        />
        <span class="theme-label">Dark</span>
      </div>
      <div class="user-row">
        <span class="user" [attr.title]="userId()">{{ userId() }}</span>
        <p-button
          label="Sign out"
          [text]="true"
          severity="secondary"
          size="small"
          ariaLabel="Sign out"
          (onClick)="logout()"
        />
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
