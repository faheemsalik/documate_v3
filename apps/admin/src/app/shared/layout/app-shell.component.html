<div class="shell">
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">{{ brand }}</span>
      <span class="topbar-hint">Platform control panel</span>
    </div>
    <div class="topbar-right">
      <span class="theme-label">Light</span>
      <p-toggleswitch
        [ngModel]="darkMode()"
        (ngModelChange)="onDarkToggle($event)"
        ariaLabel="Toggle dark theme"
      />
      <span class="theme-label">Dark</span>
      <span class="user">{{ userId() }}</span>
      <p-button label="Sign out" [text]="true" severity="secondary" size="small" (onClick)="logout()" />
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <div class="sidebar-brand">Admin</div>
      <div class="nav-scroll">
        @for (group of groups; track group.label) {
          <div class="nav-group">
            <button type="button" class="nav-group-header" (click)="toggleGroup(group)">
              <span>{{ group.label }}</span>
              <span class="chevron">{{ isExpanded(group) ? '▾' : '▸' }}</span>
            </button>
            @if (isExpanded(group)) {
              @for (item of group.items; track item.route) {
                <a class="nav-item indent" [routerLink]="item.route" routerLinkActive="active">
                  {{ item.label }}
                </a>
              }
            }
          </div>
        }
      </div>
      <div class="sidebar-footer">{{ userId() }}</div>
    </aside>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
